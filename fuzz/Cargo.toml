[package]
name = "mwemu-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libmwemu = { path = "../crates/libmwemu" }

[workspace]

[[bin]]
name = "fuzz_load_code"
path = "fuzz_targets/fuzz_load_code.rs"
doc = false

[[bin]]
name = "fuzz_run_shellcode"
path = "fuzz_targets/fuzz_run_shellcode.rs"
doc = false

[[bin]]
name = "fuzz_load_code64"
path = "fuzz_targets/fuzz_load_code64.rs"
doc = false

[[bin]]
name = "fuzz_run_shellcode64"
path = "fuzz_targets/fuzz_run_shellcode64.rs"
doc = false
